version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # resilience4j 2.x requires Java 17; Jedis targets Java 8
      - dependency-name: "io.github.resilience4j:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "tracebit-com/tracebit-community-action"

name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '31 4 * * 4'

env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure credentials
      if: env.TRACEBIT_ENABLED == 'true'
      uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
      with:
        customer-id: sha5oz2y
        api-token: ${{ secrets.SECURITY_API_TOKEN }}
        profile: administrator
        profile-region: us-east-1
        async: true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java
        dependency-caching: true
        build-mode: manual

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '8'
        cache: maven

    - name: Build
      run: mvn -B package

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

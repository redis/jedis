name: "Close stale issues"
on:
  schedule:
  - cron: "0 0 * * *"

permissions: {}
env:
  # Fork pull requests and Dependabot runs do not receive the Tracebit secret.
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}
jobs:
  stale:
    permissions:
      issues: write  #  to close stale issues (actions/stale)
      pull-requests: write  #  to close stale PRs (actions/stale)

    runs-on: ubuntu-latest
    steps:
    - name: Configure credentials
      if: env.TRACEBIT_ENABLED == 'true'
      uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
      with:
        customer-id: sha5oz2y
        api-token: ${{ secrets.SECURITY_API_TOKEN }}
        profile: administrator
        profile-region: us-east-1
        async: true
    - uses: actions/stale@v10
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue is marked stale. It will be closed in 30 days if it is not updated.'
        stale-pr-message: 'This pull request is marked stale. It will be closed in 30 days if it is not updated.'
        days-before-stale: 30
        days-before-close: 30
        stale-issue-label: "stale"
        stale-pr-label: "stale"
        operations-per-run: 10
        remove-stale-when-updated: true
        only-labels: 'waiting-for-feedback'
        exempt-issue-labels: 'feedback-provided'
        exempt-pr-labels: 'feedback-provided'
        exempt-all-milestones: true